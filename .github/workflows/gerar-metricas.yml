name: Gerar Estatísticas do Perfil

on:
  schedule:
    - cron: "0 0 * * *" # Atualiza todos os dias à meia-noite
  workflow_dispatch:    # Permite rodar manualmente clicando no botão
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Gera o card de Métricas
      - name: Gerar arquivo metrics.svg
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          config_timezone: America/Sao_Paulo
          config_theme: tokyonight
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      # 2. Gera a animação da Cobrinha
      - name: Gerar Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Salva a cobrinha em uma branch separada chamada 'output'
      - name: Salvar Snake na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
